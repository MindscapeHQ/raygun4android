spotless {
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings(true)
        removeUnusedImports()
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    kotlin {
        target '**/*.kt'
        ktfmt().googleStyle().configure {
            it.setBlockIndent(4)
            it.setContinuationIndent(4)
        }
        ktlint()
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        leadingTabsToSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'xml', {
        target '**/*.xml'
        targetExclude '.idea/**/*.xml'
        leadingTabsToSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'yml', {
        target '**/*.yml'
        leadingTabsToSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
