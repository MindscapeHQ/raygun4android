/*
 * Setup a sample Gradle task for deployment notification
 * This is done as a function so that there's more flexibility when it comes to dealing with creating the tasks for multiple flavours etc.
 */
def createRaygunNotifyDeploymentTask(token,key,groupName,version,userName,userEmail) {

    tasks.register("notifyDeployment") {
        group = "${groupName}"

        doLast {
            def url = new URL("https://app.raygun.io/deployments?authToken=${token}")
            def connection = url.openConnection() as HttpURLConnection
            connection.requestMethod = 'POST'
            connection.setRequestProperty('Content-Type', 'application/json')
            connection.doOutput = true

            def body = JsonOutput.toJson([
                apiKey: key,
                version: version,
                ownerName: userName,
                emailAddress: userEmail
            ])
            connection.outputStream.withWriter('UTF-8') { it.write(body) }

            def response = connection.inputStream.withReader('UTF-8') { it.text }
            def result = new JsonSlurper().parseText(response)

            println result
            def depId = result.deploymentId as Long
            assert depId != null && depId != '' && depId > 0
        }
    }
}

/*
 * Setup a sample Gradle task for upload proguard mapping files
 * This is done as a function so that there's more flexibility when it comes to dealing with creating the tasks for multiple flavours etc.
 */
def createRaygunProguardTask(token,raygunAppPath,groupName,version) {

    tasks.register("uploadProguardMapping") {
        group = "${groupName}"

        doLast {
            def mappingFile = file("${project.rootDir}/app/build/outputs/mapping/release/mapping.txt")
            if (!mappingFile.exists()) {
                throw new GradleException("Mapping file not found: ${mappingFile.absolutePath}")
            }

            def boundary = "----RaygunBoundary" + System.currentTimeMillis()
            def endpointUrl = "https://app.raygun.com/upload/proguardsymbols/${raygunAppPath}?authToken=${token}"
            def url = new URL(endpointUrl)
            def connection = url.openConnection() as HttpURLConnection
            connection.requestMethod = 'POST'
            connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")
            connection.doOutput = true

            connection.outputStream.withStream { out ->
                def writer = new PrintWriter(new OutputStreamWriter(out, 'UTF-8'), true)

                // version field
                writer.append("--${boundary}\r\n")
                writer.append("Content-Disposition: form-data; name=\"version\"\r\n\r\n")
                writer.append("${version}\r\n")

                // file field
                writer.append("--${boundary}\r\n")
                writer.append("Content-Disposition: form-data; name=\"file\"; filename=\"${mappingFile.name}\"\r\n")
                writer.append("Content-Type: application/octet-stream\r\n\r\n")
                writer.flush()
                mappingFile.withInputStream { input -> out << input }
                out.flush()
                writer.append("\r\n")

                writer.append("--${boundary}--\r\n")
                writer.flush()
            }

            def responseCode = connection.responseCode
            def result = connection.inputStream.withReader('UTF-8') { it.text }
            println "HTTP ${responseCode}: ${result}"
            assert result == "true"
        }
    }
}

android {

    def keystoreFile = file('testkeystore.jks')
    if (keystoreFile.exists()) {
        signingConfigs {
            releaseConfig {
                keyAlias 'testkey'
                keyPassword '123456'
                storeFile keystoreFile
                storePassword '123456'
            }
        }
    }

    compileSdk = 36

    defaultConfig {
        applicationId = "com.raygun.raygun4android"
        minSdk = 23
        targetSdk = 36
        buildConfigField("long", "VERSION_CODE", VERSION_CODE)
        buildConfigField("String","VERSION_NAME","\"${VERSION_NAME}-sample\"")
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable += ['LogNotTimber', 'StringFormatInTimber', 'ThrowableNotAtBeginning', 'BinaryOperationInTimber', 'TimberArgCount', 'TimberArgTypes', 'TimberTagLength']
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.releaseConfig
            }
        }
        debug {
            debuggable = true
            minifyEnabled = false
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-DEBUG'
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Setup RG tasks
    createRaygunNotifyDeploymentTask(RAYGUN_API_TOKEN, RAYGUN_API_KEY, RAYGUN_GROUP, defaultConfig.versionName, localUserName, localUserEmail)
    createRaygunProguardTask(RAYGUN_API_TOKEN, RAYGUN_APP_PATH, RAYGUN_GROUP, defaultConfig.versionName)
    namespace = 'com.raygun.raygun4android.sample'
}

