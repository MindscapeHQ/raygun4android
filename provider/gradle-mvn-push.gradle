/*
 * Originally based on https://github.com/chrisbanes/gradle-mvn-push/blob/master/gradle-mvn-push.gradle
 * Modified by Raygun to use the `maven-publish` plugin
 * instead of the `maven` plugin, which has been deprecated.
 */

apply plugin: 'maven-publish'
apply plugin: 'signing'

def isReleaseBuild() {
    return !VERSION_NAME.contains("SNAPSHOT")
}

def getReleaseRepositoryUrl() {
    return hasProperty('RELEASE_REPOSITORY_URL') ? RELEASE_REPOSITORY_URL
            : "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
}

def getSnapshotRepositoryUrl() {
    return hasProperty('SNAPSHOT_REPOSITORY_URL') ? SNAPSHOT_REPOSITORY_URL
            : "https://oss.sonatype.org/content/repositories/snapshots/"
}

def getRepositoryUsername() {
    return hasProperty('NEXUS_USERNAME') ? NEXUS_USERNAME : ""
}

def getRepositoryPassword() {
    return hasProperty('NEXUS_PASSWORD') ? NEXUS_PASSWORD : ""
}

afterEvaluate { project ->
    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = VERSION_NAME

                pom {
                    name = POM_NAME
                    packaging = POM_PACKAGING
                    description = POM_DESCRIPTION
                    url = POM_URL

                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }

                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                            distribution = POM_LICENCE_DIST
                        }
                    }

                    developers {
                        developer {
                            id = POM_DEVELOPER_1_ID
                            name = POM_DEVELOPER_1_NAME
                        }
                        developer {
                            id = POM_DEVELOPER_2_ID
                            name = POM_DEVELOPER_2_NAME
                        }
                        developer {
                            id = POM_DEVELOPER_3_ID
                            name = POM_DEVELOPER_3_NAME
                        }
                    }
                }

                afterEvaluate {
                    from components.release
                }
            }
        }
        repositories {
            maven {
                if (isReleaseBuild()) {
                    url getReleaseRepositoryUrl()
                } else {
                    url getSnapshotRepositoryUrl()
                }
                credentials {
                    username getRepositoryUsername()
                    password getRepositoryPassword()
                }
            }
        }
    }

    signing {
        required { isReleaseBuild() }
        sign publishing.publications.mavenJava
    }
}
