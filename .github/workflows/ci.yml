name: "CI"

on: [push]

# Cancel running job if a new push is made to the same branch
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 17
  # See https://github.com/actions/setup-java?tab=readme-ov-file#supported-distributions
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  spotless:
    name: "Spotless"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew spotlessCheck

  app-lint:
    name: "app:lint"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew app:lint

  provider-lint:
    name: "provider:lint"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew provider:lint

  app-assemble-debug:
    name: "app:assembleDebug"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew app:assembleDebug

  provider-assemble-debug:
    name: "provider:assembleDebug"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew provider:assembleDebug

  provider-test:
    name: "provider:test"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - run: ./gradlew provider:test verifyOkHttpDependencyAlignment

  kotlin-compatibility:
    name: "Kotlin 2.1 consumer"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    - name: Generate the published artifact
      shell: bash
      run: |
        version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
        repository="$RUNNER_TEMP/raygun-repository"
        artifact="$repository/com/raygun/raygun4android/$version"

        ./gradlew --no-daemon \
          :provider:generateMetadataFileForMavenPublication \
          :provider:generatePomFileForMavenPublication

        mkdir -p "$artifact"
        cp provider/build/outputs/aar/raygun4android.aar "$artifact/raygun4android-$version.aar"
        cp provider/build/publications/maven/module.json "$artifact/raygun4android-$version.module"
        cp provider/build/publications/maven/pom-default.xml "$artifact/raygun4android-$version.pom"

        echo "RAYGUN_TEST_REPOSITORY=$repository" >> "$GITHUB_ENV"
        echo "RAYGUN_TEST_VERSION=$version" >> "$GITHUB_ENV"
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "8.14.3"
    - name: Compile with Kotlin 2.1
      run: >-
        gradle --no-daemon
        -p integration-tests/kotlin-2.1-consumer
        -PraygunRepository="$RAYGUN_TEST_REPOSITORY"
        -PraygunVersion="$RAYGUN_TEST_VERSION"
        :app:compileDebugKotlin

  app-connected-test:
    name: "app:connectedTest"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6.0.0
      with:
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-version: ${{ env.JAVA_VERSION }}
    # From https://github.com/marketplace/actions/android-emulator-runner
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        script: ./gradlew connectedCheck
